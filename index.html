<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Undangan Pernikahan Azmi & Taher</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-family: Georgia, serif;
      color: #594638;
      background: #f8f3eb;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 42px 24px;
      border: 1px solid #c9b49c;
      background: #fffdf9;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-weight: normal;
      font-size: 34px;
      line-height: 1.4;
      margin: 24px 0;
    }

    .name {
      font-size: 25px;
      margin: 22px 0;
      overflow-wrap: anywhere;
    }

    .message {
      font-size: 14px;
      line-height: 1.8;
      margin: 24px 0;
    }

    a {
      display: inline-block;
      padding: 13px 28px;
      background: #806950;
      color: white;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The Wedding Of</p>
    <h1>Azmi<br>&amp;<br>Taher</h1>

    <p>Kepada Yth.</p>
    <p>Bapak/Ibu/Saudara/i</p>
    <div class="name" id="guestName">Tamu Undangan</div>

    <p class="message">
      Dengan penuh kebahagiaan, kami mengundang Anda
      untuk hadir di hari istimewa kami.
    </p>

    <a href="https://azmi-taher-wedding.my.canva.site/1">
      BUKA UNDANGAN
    </a>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("to");

    document.getElementById("guestName").textContent =
      name ? name.replace(/\+/g, " ").trim() : "Tamu Undangan";
  </script>
</body>
</html>
